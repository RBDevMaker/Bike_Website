AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Bike Shop

  SAM Template for Bike Shop

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3

Resources:
  BikeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: BikeShopUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  BikeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: BikeShopWebClient
      UserPoolId: !Ref BikeUserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - phone
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - http://localhost:8083/absproxy/8081
      SupportedIdentityProviders:
        - COGNITO

  BikeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "bikeshop-${AWS::AccountId}"
      UserPoolId: !Ref BikeUserPool

  BikeAPI:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/us-east-1_BYyFWm8XX"

  GetProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/get_products
      Handler: get_products.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Events:
        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /products
            Method: get
            Auth:
              Authorizer: NONE

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/get_orders
      Handler: get_orders.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        GetOrders:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /orders
            Method: get
        GetOrdersOptions:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /orders
            Method: options

  GetOrderDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/get_order
      Handler: get_order.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Events:
        GetOrderDetails:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /orders/{id}
            Method: get
        GetOrderDetailsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /orders/{id}
            Method: options

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/create_order.py
      Handler: create_order.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref BikeAPI
            Path: /orders
            Method: post

  ProductsTable:
    Type: "AWS::DynamoDB::Table"
    Properties:
      TableName: BikeProducts
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  OrdersTable:
    Type: "AWS::DynamoDB::Table"
    Properties:
      TableName: Orders
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

Outputs:
  MicroserviceApi:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${BikeAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
  GetProductsFunction:
    Description: "GetProductsFunction ARN"
    Value: !GetAtt GetProductsFunction.Arn
  EndpointForGetProducts:
    Description: "API Gateway endpoint URL for Get Products function"
    Value: !Sub "https://${BikeAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/products/"
  GetOrdersFunction:
    Description: "GetOrdersFunction ARN"
    Value: !GetAtt GetOrdersFunction.Arn
  EndpointForGetOrders:
    Description: "API Gateway endpoint URL for Get Orders function"
    Value: !Sub "https://${BikeAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders/"
  GetOrderDetailsFunction:
    Description: "GetOrderDetailsFunction ARN"
    Value: !GetAtt GetOrderDetailsFunction.Arn
  EndpointForGetOrderDetails:
    Description: "API Gateway endpoint URL for Get Order Details function"
    Value: !Sub "https://${BikeAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders/{id}"
  CreateOrderFunction:
    Description: "CreateOrderFunction ARN"
    Value: !GetAtt CreateOrderFunction.Arn
  EndpointForCreateOrder:
    Description: "API Gateway endpoint URL for Create Order function"
    Value: !Sub "https://${BikeAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/orders"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref BikeUserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref BikeUserPoolClient
  UserPoolDomain:
    Description: "Cognito Hosted UI Domain"
    Value: !Sub "https://bikeshop-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
